name: employment-ai-mvp

services:
  employment-ai:
    build:
      context: .
    image: employment-ai-mvp:local
    ports:
      - "${BIND_HOST:-127.0.0.1}:${APP_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      SESSION_SECRET: ${SESSION_SECRET:-change-this-demo-secret-before-production}
      OPERATOR_PASSWORD: ${OPERATOR_PASSWORD:-operator-demo}
      REVIEWER_PASSWORD: ${REVIEWER_PASSWORD:-reviewer-demo}
      AUTO_SEED: ${AUTO_SEED:-true}
      AUTH_DISABLED: ${AUTH_DISABLED:-false}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
      DATABASE_PATH: /app/runtime/employment_ai.db
      SEED_XLSX: /app/data/synthetic/employment_ai_demo.xlsx
      ONTOLOGY_PATH: /app/data/ontology/employment_ontology.json
      DISABLED_PLUGINS: ${DISABLED_PLUGINS:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-deepseek}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-45}
      LLM_CANDIDATE_LIMIT: ${LLM_CANDIDATE_LIMIT:-20}
      LLM_WEIGHT: ${LLM_WEIGHT:-0.4}
      LLM_REQUIRED: ${LLM_REQUIRED:-false}
      LLM_THINKING: ${LLM_THINKING:-false}
    volumes:
      - employment_ai_runtime:/app/runtime
    restart: unless-stopped

volumes:
  employment_ai_runtime:
